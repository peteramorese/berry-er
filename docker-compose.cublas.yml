services:
  ws-cublas:
    build:
      context: ./
      dockerfile: Dockerfile.cublas
    network_mode: host
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - .:/root/berry-er
    command: tail -f /dev/null  # Temporary command to keep the container running
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

